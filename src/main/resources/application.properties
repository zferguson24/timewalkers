# Datasource — the EC2 instance's systemd EnvironmentFile injects PG* vars; local dev defaults used as fallback
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:timewalkersdb}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# API key for endpoint authentication — must be set as an environment variable
api.key=${API_KEY}

# springdoc is only needed locally to regenerate swagger.yaml (see CLAUDE.md) — nothing
# in production ever hits /v3/api-docs or Swagger UI. Disabled by default so cold starts
# don't pay for building the OpenAPI model; re-enabled in application-local.properties.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# No jakarta.validation annotations are in use and no validator is on the classpath —
# without this, Spring Boot attempts and fails to configure one on every startup
# (logs a NoProviderFoundException warning for no benefit).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.validation.ValidationAutoConfiguration

# Default log level: WARN and ERROR are emitted in all environments.
# The local profile overrides this to DEBUG — see application-local.properties.
logging.level.com.wow.timewalkers=WARN

# Access logging (see config/AccessLogFilter) — always emitted regardless of the
# WARN-only default above, since visibility into real traffic matters here. Replaces
# Tomcat's file-based AccessLogValve, which can't write anywhere in Lambda's
# read-only filesystem.
logging.level.com.wow.timewalkers.config.AccessLogFilter=INFO
