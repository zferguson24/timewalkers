# Local profile — activates full DEBUG tracing for the application package.
# DEBUG logs are suppressed in all other environments (see application.properties).
logging.level.com.wow.timewalkers=DEBUG

# springdoc is disabled by default (see application.properties) but is required here —
# swagger.yaml regeneration boots the app under this profile specifically to hit the
# live /v3/api-docs.yaml endpoint.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
