name: Deploy to Lambda

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        # Runs the full test suite as part of `mvn clean package` inside the Dockerfile —
        # a test failure fails this step, and nothing gets pushed or deployed.
        # --provenance=false avoids an extra attestation manifest that Lambda's container
        # image support can't handle.
        run: docker build --provenance=false --platform linux/amd64 -t timewalkers-api:latest .

      - name: Tag and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag timewalkers-api:latest $REGISTRY/timewalkers-api:latest
          docker push $REGISTRY/timewalkers-api:latest

      - name: Update Lambda function code
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws lambda update-function-code \
            --function-name timewalkers-api \
            --image-uri $REGISTRY/timewalkers-api:latest

          aws lambda wait function-updated \
            --function-name timewalkers-api